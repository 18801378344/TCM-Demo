<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}TCM Literature Import{% endblock %}</title>
<style>body{font:18px/1.6 system-ui,sans-serif;max-width:850px;margin:2rem auto;padding:0 1rem;color:#182b3a;background:#fafafa}a{color:#064f8c}input,button{font:inherit;padding:.5rem;max-width:100%;box-sizing:border-box}button{cursor:pointer}nav{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}nav form{margin:0}label{display:block;font-weight:bold}.errorlist{color:#9b1717}.helptext{display:block} :focus-visible{outline:3px solid #a64800;outline-offset:3px}article{border-bottom:1px solid #bbb;padding:1rem 0}.abstract{white-space:pre-wrap;overflow-wrap:anywhere}h1,h2{overflow-wrap:anywhere}</style></head>
<body><a href="#main">Skip to content</a><nav aria-label="Main">{% if user.is_authenticated %}<a href="{% url 'documents:list' %}">My documents</a><a href="{% url 'documents:upload' %}">Import CSV</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>{% endif %}</nav>
<main id="main">{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
